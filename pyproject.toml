[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fincad"
version = "0.1.0"
description = "Inference-time mitigation of parametric look-ahead bias in LLM financial backtesting"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Weixian Waylon Li" },
  { name = "Mengyu Wang" },
  { name = "Tiejun Ma" },
]
keywords = ["large-language-models", "finance", "backtesting", "look-ahead-bias", "context-aware-decoding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "accelerate>=0.30",
  "datasets>=2.18",
  "huggingface-hub>=0.24",
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
  "torch>=2.1",
  "tqdm>=4.66",
  "transformers>=4.50",
]

[project.optional-dependencies]
discovery = [
  "dspy>=2.5",
  "python-dotenv>=1.0",
]
reproduction = [
  "pyarrow>=15",
  "scipy>=1.10",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
fincad = "cad.cli:main"
fincad-discover = "cad.discovery.__main__:main"
fincad-profile = "cad.discovery.profiler:main"

[tool.setuptools]
py-modules = ["adapters"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cad*", "benchmark*", "utils*"]
namespaces = true

[tool.setuptools.package-data]
utils = ["entity.json"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
